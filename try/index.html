<!doctype html>
<html lang="en" data-palette-mode="static">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palette Forge</title>
  <style>
    body { margin: 0; padding: 34px 21px; background: #F0F4F8; color: #102A43; font: 16px/1.55 sans-serif; }
    #load { max-width: 34rem; margin: 15vh auto; }
    @media (prefers-color-scheme: dark) { body { background: #102A43; color: #F0F4F8; } }
  </style>
  <script src="wasm_exec.js" defer></script>
  <script src="browser.js" defer></script>
</head>
<body>
  <div id="load" role="status"><h1>Palette Forge</h1><p>Loading your palette workspace…</p></div>
  <noscript>The static demo needs WebAssembly and JavaScript. Run the standalone Palette Forge server to use color and hex inputs without JavaScript.</noscript>
</body>
</html>
